<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <div id="root">
      <div id="boot-screen" style="min-height:100vh;display:grid;place-items:center;color:#716d64;font-family:'Microsoft YaHei',sans-serif">
        <div style="text-align:center"><b style="display:inline-grid;place-items:center;width:42px;height:42px;background:#ae3f32;color:#fff;border-radius:4px;font-size:22px">念</b><p style="font-size:13px">正在载入一念 AI…</p></div>
      </div>

    <script>
      window.__qimingBootTimer = setTimeout(function () {
        var boot = document.getElementById('boot-screen');
        if (boot) boot.innerHTML = '<div style="max-width:420px;padding:24px;text-align:center"><b style="color:#ae3f32">前端资源加载失败</b><p style="font-size:13px;line-height:1.8">请停止开发服务器后重新运行 npm run dev，然后按 Ctrl + F5 刷新页面。</p></div>';
      }, 10000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
