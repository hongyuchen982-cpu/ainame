services:
  web:
    build: .
    restart: always
    env_file:
      - .env
    networks:
      - ai_name_net
    depends_on:
      db:
        condition: service_healthy
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./generated_reports:/app/generated_reports
      - ./chroma_rag_db:/app/chroma_rag_db

  db:
    image: mysql:8.0
    restart: always
    networks:
      ai_name_net:
        aliases:
          - db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ainame
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD} --silent" ]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres_db:
    image: postgres:15-alpine
    restart: always
    networks:
      ai_name_net:
        aliases:
          - postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ai_name
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ai_name" ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:alpine
    restart: always
    networks:
      ai_name_net:
        aliases:
          - redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 20

  nginx:
    image: nginx:alpine
    restart: always
    networks:
      - ai_name_net
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web

volumes:
  mysql_data:
  postgres_data:
  redis_data:

networks:
  ai_name_net:
    driver: bridge
