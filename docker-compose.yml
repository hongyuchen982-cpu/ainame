services:
  web:
    build: .
    restart: always
    env_file:
      - ${DOCKER_ENV_FILE:-.env.docker}
    environment:
      DB_URI: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/ainame?charset=utf8mb4
      LANGGRAPH_DB_URI: postgresql://postgres:${POSTGRES_PASSWORD}@postgres_db:5432/ai_name
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai_name_net
    depends_on:
      db:
        condition: service_healthy
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./output/pdf:/app/output/pdf
      - ./chroma_rag_db:/app/chroma_rag_db
      - ./static:/app/static
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3)" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  db:
    image: mysql:8.0
    restart: always
    networks:
      ai_name_net:
        aliases:
          - db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ainame
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Force TCP so the temporary socket-only initialization server is not
      # mistaken for the final MySQL server listening on port 3306.
      test: [ "CMD-SHELL", "mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent" ]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres_db:
    image: postgres:15-alpine
    restart: always
    networks:
      ai_name_net:
        aliases:
          - postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ai_name
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ai_name" ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:alpine
    restart: always
    networks:
      ai_name_net:
        aliases:
          - redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-alpine
    restart: always
    networks:
      - ai_name_net
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 30

  rag_worker:
    build: .
    restart: always
    command: [ "python", "rag_worker.py" ]
    env_file:
      - ${DOCKER_ENV_FILE:-.env.docker}
    environment:
      DB_URI: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/ainame?charset=utf8mb4
      LANGGRAPH_DB_URI: postgresql://postgres:${POSTGRES_PASSWORD}@postgres_db:5432/ai_name
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ai_name_net
    depends_on:
      db:
        condition: service_healthy
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./chroma_rag_db:/app/chroma_rag_db

  frontend:
    image: node:20-alpine
    restart: always
    working_dir: /app
    command: [ "sh", "-c", "test -x node_modules/.bin/vite || npm install; npm run dev -- --host 0.0.0.0" ]
    environment:
      VITE_PROXY_TARGET: http://web:8000
    networks:
      - ai_name_net
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  nginx:
    image: nginx:alpine
    restart: always
    networks:
      - ai_name_net
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/docs" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  mysql_data:
  postgres_data:
  redis_data:
  frontend_node_modules:

networks:
  ai_name_net:
    driver: bridge
