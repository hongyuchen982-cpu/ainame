events {}

http {
    server {
        listen 80;
        server_name _;

        # Docker containers may receive a new IP after a rebuild. Resolve the
        # service name through Docker DNS for every validity window instead of
        # caching the address from Nginx startup forever.
        resolver 127.0.0.11 valid=10s ipv6=off;

        location / {
            set $backend_api http://web:8000;
            proxy_pass $backend_api;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
